<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebert Pezzoti | Links</title>
    <style>
        /* Reset e Estilos Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #0f172a, #1e3a8a); 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        
        /* Container Principal */
        .container { 
            max-width: 480px; 
            width: 100%; 
            text-align: center; 
            margin-top: 40px; 
        }
        
        /* Avatar e Bio */
        .avatar { 
            width: 96px; 
            height: 96px; 
            background: #1e293b; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 48px; 
            margin: 0 auto 16px; 
            border: 2px solid #3b82f6; 
        }
        h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 600; }
        .bio { color: #cbd5e1; margin-bottom: 32px; font-size: 0.95rem; }
        
        /* Botões de Link */
        .link-btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 16px; 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 12px; 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: 500; 
            transition: transform 0.2s ease, background 0.2s ease; 
        }
        .link-btn:hover { 
            transform: translateY(-2px); 
            background: rgba(255, 255, 255, 0.2); 
        }
        
        /* Rodapé */
        .footer { 
            margin-top: 40px; 
            font-size: 0.8rem; 
            color: #64748b; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ícone da Chave Inglesa -->
        <div class="avatar">🔧</div>
        
        <h1>hebertpezzoti</h1>
        <p class="bio">✨ Criação de Páginas e Conteúdos Digitais! ✨</p>

        <!-- Botões -->
        <a href="https://wa.me/55SEUNUMERO" class="link-btn" target="_blank">
            💬 Quer uma página como esta? Chame no WhatsApp!
        </a>
        
        <a href="mailto:hebertpezzoti@hotmail.com" class="link-btn">
             Prefere e-mail? Peça seu orçamento
        </a>
        
        <a href="#" class="link-btn" target="_blank">
            ️ Veja exemplos do meu trabalho
        </a>

        <div class="footer">Hospedado no GitHub Pages 🚀</div>
    </div>

</body>
</html>
